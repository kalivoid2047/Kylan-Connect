name: kylan_connect
description: A production-ready offline peer-to-peer messaging platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Encryption
  # X25519 ECDH key agreement + AES-GCM authenticated encryption + HKDF.
  cryptography: ^2.7.0
  crypto: ^3.0.3

  # UUID Generation
  uuid: ^4.5.1

  # JSON Serialization
  json_annotation: ^4.9.0

  # UI Components
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Media (image sharing)
  image_picker: ^1.1.2
  image: ^4.2.0

  # File sharing
  file_picker: ^8.1.2
  open_filex: ^4.5.0

  # Voice messages
  record: ^5.1.2
  audioplayers: ^6.1.0

  # OS notifications
  flutter_local_notifications: ^18.0.1

  # Utilities
  intl: ^0.19.0
  logger: ^2.4.0
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

  # Linting
  flutter_lints: ^4.0.0

  # Testing
  mockito: ^5.4.4
  fake_async: ^1.3.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
